name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS 構文チェック
        run: for f in extension/*.js; do node --check "$f"; done

      - name: manifest.json の検証
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("extension/manifest.json"));
            if (m.manifest_version !== 3) throw new Error("manifest_version must be 3");
            if (!m.key) throw new Error("key が無い — 拡張 ID が固定されない");
            const files = [m.background.service_worker, ...m.content_scripts.flatMap(c => c.js), ...Object.values(m.icons), m.action.default_icon];
            for (const f of files) if (!fs.existsSync("extension/" + f)) throw new Error("missing: " + f);
            // 拡張 ID が installer 側 (native host の allowed_origins / ポリシー) と一致するか
            const id = [...require("crypto").createHash("sha256").update(Buffer.from(m.key, "base64")).digest("hex").slice(0, 32)].map(c => String.fromCharCode(97 + parseInt(c, 16))).join("");
            for (const p of ["installer/native-host-manifest.json", "installer/main.wxs", ".github/workflows/release.yml", "README.md"]) {
              if (!fs.readFileSync(p, "utf8").includes(id)) throw new Error(p + " に拡張 ID " + id + " が無い");
            }
            console.log("manifest OK:", m.name, m.version, id);
          '

      - name: .ps1 は UTF-8 BOM 付きか (Windows PowerShell 5.1 は BOM 無しを ANSI で読んで文字化けする)
        run: |
          set -euo pipefail
          fail=0
          for f in $(git ls-files '*.ps1'); do
            if [ "$(head -c3 "$f" | xxd -p)" != "efbbbf" ]; then
              echo "::error file=$f::UTF-8 BOM が無い。日本語を含むと Windows PowerShell 5.1 で構文エラーになる"
              fail=1
            fi
          done
          exit $fail

  # PR (non-draft) から dev prerelease を出す。merge を待たずに MSI を試せる。
  dev-release:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    uses: ./.github/workflows/release.yml
    # workflow_call には secret が自動で渡らない。inherit しないと CRX_PRIVATE_KEY が空のまま呼ばれて署名で落ちる。
    secrets: inherit
    with:
      tag_name: dev-${{ github.run_number }}
      target_commitish: ${{ github.event.pull_request.head.sha }}

  # CI green (dev release のビルド成功込み) → squash auto-merge (org 標準の reusable)。
  # merge されると main への push で Release が自動採番されて出る (release.yml)。
  auto-merge:
    name: Auto Merge
    needs: [check, dev-release]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.check.result == 'success' &&
      needs['dev-release'].result == 'success'
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
    # CI_APP_ID / CI_APP_PRIVATE_KEY (org secret)。App token でないと merge の push actor が
    # github-actions[bot] になり、release.yml が発火しない。
    secrets: inherit
